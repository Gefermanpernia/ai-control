name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: ./scripts/test

  # The engine on Debian, on both CPU architectures the Linux packages target.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test

  # The terminal UI: formatting, lints and tests.
  tui:
    runs-on: ubuntu-24.04
    container: rust:1
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
