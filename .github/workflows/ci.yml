name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: ./scripts/test

  # The engine on Debian, on both CPU architectures the Linux packages target.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test

  # Install the actual packages in clean Debian and Arch containers.
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.arch }} packages
        run: docker run --rm -v "$PWD":/src -w /src swift:6.2-bookworm ./scripts/package-linux 0.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: ai-control-deb-${{ matrix.deb_arch }}
          path: dist/ai-control_0.0.0_${{ matrix.deb_arch }}.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/ai-control-0.0.0-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - name: Install Debian packages and smoke test
        env:
          DEB: ai-control_0.0.0_${{ matrix.deb_arch }}.deb
        run: |
          dpkg-deb -f "dist/$DEB" Depends
          for image in debian:bookworm-slim debian:trixie-slim ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -e DEB -v "$PWD/dist":/dist:ro "$image" sh -ec '
              apt-get update -qq
              apt-get install -y -qq "/dist/$DEB" systemd
              for unit in ai-control-auto-switch.service ai-control-auto-switch.timer; do
                test -f "/usr/lib/systemd/user/$unit"
                systemd-analyze verify "/usr/lib/systemd/user/$unit"
              done
              test ! -e /usr/lib/systemd/user/timers.target.wants/ai-control-auto-switch.timer
              aic status --json | grep -q '\''"version":1'\''
              aic-tui --help
              # First Codex use on a clean system reaches sign-in (no codex installed here) instead of
              # failing because the data directory does not exist yet.
              export XDG_DATA_HOME=$(mktemp -d)/share
              if /usr/lib/ai-control/AIControl codex-login add first > /tmp/add 2>&1; then exit 1; fi
              grep -q "Sign-in did not finish" /tmp/add
            '
          done

  # The release PKGBUILD with real checksums of both tarballs, installed on Arch (x86_64 image only).
  arch:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Generate PKGBUILD
        run: ./scripts/package-linux --pkgbuild 0.0.0
      - name: Install Arch package and smoke test
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro archlinux:latest sh -ec '
            pacman -Syu --noconfirm base-devel curl
            mkdir /build
            cp /dist/ai-control-0.0.0-linux-x86_64.tar.gz /dist/PKGBUILD /build/
            # Only the download URL is local; makepkg still verifies the generated checksum.
            sed -i "s|^source_x86_64=.*|source_x86_64=(\"file:///build/ai-control-0.0.0-linux-x86_64.tar.gz\")|" /build/PKGBUILD
            if grep -q SKIP /build/PKGBUILD; then echo "PKGBUILD skips checksums" >&2; exit 1; fi
            useradd -m builder
            chown -R builder:builder /build
            su builder -s /bin/sh -c "cd /build && makepkg --noconfirm"
            pacman -U --noconfirm /build/ai-control-0.0.0-1-x86_64.pkg.tar.zst
            test -f /usr/lib/systemd/user/ai-control-auto-switch.service
            test -f /usr/lib/systemd/user/ai-control-auto-switch.timer
            aic status --json | grep -q '\''"version":1'\''
            aic-tui --help
            export XDG_DATA_HOME=$(mktemp -d)/share
            if /usr/lib/ai-control/AIControl codex-login add first > /tmp/add 2>&1; then exit 1; fi
            grep -q "Sign-in did not finish" /tmp/add
          '

  # Install the published Debian artifact in Ubuntu under WSL 2.
  wsl:
    needs: packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ai-control-deb-amd64
          path: dist
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
      - name: Install package and exercise WSL launcher
        shell: wsl-bash {0}
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq ./dist/ai-control_0.0.0_amd64.deb tmux
          aic status --json | grep -q '"version"'
          aic-tui --help
          AIC_UNDER_TEST=/usr/bin/aic sh ./scripts/test-aic
          grep -E ' (drvfs|9p) ' /proc/self/mounts || true
          drive=
          for letter in c d; do
            if grep -Eq " /mnt/$letter (drvfs|9p) " /proc/self/mounts &&
               mkdir -p "/mnt/$letter/Users/Public/aic-ci"; then
              drive="/mnt/$letter/Users/Public/aic-ci"
              break
            fi
          done
          [ -n "$drive" ]
          work=$(mktemp -d)
          marker=$work/ran
          engine=$work/engine
          printf '#!/bin/sh\nprintf "engine ran\\n" >> "%s"\n' "$marker" > "$engine"
          printf '#!/bin/sh\nprintf "windows ran\\n" >> "%s"\n' "$marker" > "$drive/codex"
          chmod +x "$engine" "$drive/codex"
          ln -s "$drive/codex" /usr/local/bin/codex
          if AIC_TEST_BINARY="$engine" aic codex login ci > "$work/output" 2> "$work/error"; then
            echo 'Windows Codex unexpectedly ran' >&2; exit 1
          fi
          grep -q 'inside WSL on Windows' "$work/error"
          [ ! -e "$marker" ]
          # End to end: the installed terminal UI and engine refuse a codex on a Windows drive mounted
          # outside /mnt, so only the mount table can identify it.
          mkdir -p /win/c
          mount --bind /mnt/c /win/c
          grep ' /win/c ' /proc/self/mounts
          sh ./scripts/e2e-tui /win/c/Users/Public/aic-e2e

  # The terminal UI: formatting, lints and tests.
  tui:
    runs-on: ubuntu-24.04
    container: rust:1
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
