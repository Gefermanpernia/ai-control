product_decisions:
  status: pending
  items:
    - id: context-semantics
      status: pending
      question: >-
        Should the product promise only a named Claude configuration context,
        without claiming a verified Anthropic account identity?
    - id: credential-precedence
      status: pending
      question: >-
        Should the trust boundary remain limited to CLAUDE_CONFIG_DIR, accepting
        that inherited higher-precedence credentials can defeat exclusive binding,
        or may the adapter reject or sanitize those variables?
    - id: usage-scope
      status: pending
      question: >-
        Should account-level usage remain unavailable until Anthropic exposes a
        stable payload that binds usage freshness to verified identity?
    - id: continuity
      status: pending
      question: >-
        Should session and history continuity be promised only within one selected
        configuration root, with no cross-context resume promise?
    - id: launcher-support
      status: pending
      question: >-
        Should the first release support only Anthropic's native launcher, or
        require explicit absolute-path registration for other installers?
    - id: version-policy
      status: pending
      question: >-
        Which allowlisted Claude Code versions should be supported, with all
        missing, malformed, older, and unreviewed versions rejected?
proposal_ready: false
blocking_reasons:
  - product-decisions-pending
  - no-exclusive-config-root-to-account-binding
  - no-stable-machine-readable-account-identity
  - no-guaranteed-stale-selector-no-fallback-check
  - no-identity-bound-fresh-usage-payload
