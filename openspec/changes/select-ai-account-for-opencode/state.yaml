research:
  selected: true
  request:
    questions:
      - Does the pinned plugin expose a stable non-secret selector for the main Claude context or one CCS context?
      - Can AI Control change the active Claude identity without reading or writing token material?
      - Does request handling remain bound to the selected identity through refresh and provider errors?
      - Can ordinary manually launched OpenCode retain shared sessions, configuration, plugins, skills, and tooling?
      - Can account usage be attributed reliably to the identity selected in AI Control?
      - What security and operational behavior enters the plugin trust boundary?
      - Is routing Claude subscription credentials from OpenCode through this plugin permitted by current Anthropic documentation?
      - What supported product boundaries remain available?
    source_classes:
      - documentation
      - open-web
